[pytest]
testpaths = tests
pythonpath = src
filterwarnings = error

# The four tiers from plan.md. Registered so a tier can be run in isolation and
# so an unknown marker is an error rather than a silent typo.
markers =
    contract: structural guarantees - schemas, register mirror, masking, import boundary
    unit: one per deterministic decision function
    scenario: acceptance scenarios AS-1..AS-14 and the named dataset traps
    harness: validation passes 0-6, computing scores rather than asserting them