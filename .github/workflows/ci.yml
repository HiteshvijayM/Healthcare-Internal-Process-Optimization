name: validate

# The four test tiers plus policy-bundle integrity. A failure in any tier fails
# the build — harness §5 grades a Sev 0 or Sev 1 as stop-run, and a CI that goes
# green while a hard gate is red is worse than no CI at all.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify the policy bundle
        # BC-1 — a hash mismatch is a startup failure, never a warning. This runs
        # first so a tampered or drifted bundle stops the build before any score
        # is computed against it.
        run: python src/admin_workflow/surface/cli.py verify

      - name: Lint — includes the decisions/ import boundary
        run: ruff check .

      - name: Contract tier
        run: python -m pytest tests/contract -q

      - name: Unit tier
        run: python -m pytest tests/unit -q

      - name: Scenario tier — AS-1..AS-14
        run: python -m pytest tests/scenario -q

      - name: Harness tier — Passes 0-6
        run: python -m pytest tests/harness -q

      - name: Evaluation scorecard
        run: python src/admin_workflow/surface/cli.py eval

      - name: Assert no criterion is Blocked
        # A Blocked criterion is not a Pass (harness §4). If a future dataset
        # revision removes a fixture, this fails rather than silently reporting
        # a lower coverage number that nobody reads.
        run: python scripts/assert_not_blocked.py
